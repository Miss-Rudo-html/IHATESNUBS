    <path d="M14 320 h24 l-10 16 h-24 z"/><path d="M52 320 h24 l-10 16 h-24 z"/>
    <path d="M90 320 h24 l-10 16 h-24 z"/><path d="M128 320 h24 l-10 16 h-24 z"/>
    <path d="M166 320 h24 l-10 16 h-24 z"/><path d="M204 320 h24 l-10 16 h-24 z"/>
