<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340">
  <defs>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a98a5"/>
      <stop offset=".45" stop-color="#e8eef3"/>
      <stop offset="1" stop-color="#7a8895"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7a87"/>
      <stop offset="1" stop-color="#3b4650"/>
